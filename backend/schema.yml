components:
  schemas:
    AdminUserWrite:
      type: object
      properties:
        username:
          type: string
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        full_name:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        active:
          type: boolean
        password:
          type: string
          writeOnly: true
      required:
      - username
    ChangePassword:
      type: object
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          writeOnly: true
      required:
      - currentPassword
      - newPassword
    CsvImport:
      type: object
      properties:
        file:
          type: string
          format: uri
      required:
      - file
    EntityEnum:
      enum:
      - OrdemServico
      - Equipamento
      - Material
      - Mantenedor
      - TipoManutencao
      - StatusOS
      - AreaManutencao
      - FamiliaEquipamento
      - PrestadoraServico
      - Localizacao
      - Prioridade
      - CentroCusto
      - NotificacaoOS
      type: string
      description: |-
        * `OrdemServico` - OrdemServico
        * `Equipamento` - Equipamento
        * `Material` - Material
        * `Mantenedor` - Mantenedor
        * `TipoManutencao` - TipoManutencao
        * `StatusOS` - StatusOS
        * `AreaManutencao` - AreaManutencao
        * `FamiliaEquipamento` - FamiliaEquipamento
        * `PrestadoraServico` - PrestadoraServico
        * `Localizacao` - Localizacao
        * `Prioridade` - Prioridade
        * `CentroCusto` - CentroCusto
        * `NotificacaoOS` - NotificacaoOS
    Extract:
      type: object
      properties:
        file_url:
          type: string
          maxLength: 2000
        json_schema: {}
      required:
