services:
  - type: web
    name: maintenancepro-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements/production.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: maintenancepro-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://maintenancepro-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://maintenancepro-web.onrender.com
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"

  - type: web
    name: maintenancepro-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://maintenancepro-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
